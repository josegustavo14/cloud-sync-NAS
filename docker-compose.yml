services:
  cloud-sync:
    image: ${PCS_IMAGE:-ghcr.io/josegustavo14/personal-cloud-sync:latest}
    build: .
    restart: unless-stopped
    init: true
    stop_grace_period: 120s
    ports:
      - "${PCS_PORT:-8080}:8080"
    environment:
      PCS_TOKEN: ${PCS_TOKEN:?Configure PCS_TOKEN in .env}
      PCS_ROOT: /DATA/CloudSync
      PCS_SOURCE_ROOT: /sources
    volumes:
      - ${PCS_ROOT:-/DATA/CloudSync}:/DATA/CloudSync
      - ${PCS_SOURCE_ROOT:-/DATA/CloudSyncSources}:/sources:ro
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
